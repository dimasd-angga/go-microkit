apiVersion: v1
kind: ConfigMap
metadata:
  name: go-microkit-config
data:
  ENV: {{ .Values.global.env | quote }}
  LOG_LEVEL: "info"
  USER_SERVICE_GRPC_PORT: "50051"
  ORDER_SERVICE_GRPC_PORT: "50052"
  GATEWAY_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: go-microkit-secrets
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.postgres.externalDSN | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
