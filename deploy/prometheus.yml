global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: "user-service"
    static_configs:
      - targets: ["user:50051"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order:50052"]
