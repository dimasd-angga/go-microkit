syntax = "proto3";

package microkit.order.v1;

option go_package = "github.com/dimasd-angga/go-microkit/proto/order;orderpb";

service OrderService {
  rpc Create     (CreateOrderRequest) returns (OrderResponse);
  rpc GetByID    (GetByIDRequest)     returns (OrderResponse);
  rpc ListByUser (ListByUserRequest)  returns (ListOrdersResponse);
  rpc MarkPaid   (MarkPaidRequest)    returns (OrderResponse);
}

message CreateOrderRequest {
  string user_id = 1;
  repeated OrderItem items = 2;
}

message OrderItem {
  string sku         = 1;
  int32  quantity    = 2;
  int64  unit_cents  = 3;
}

message GetByIDRequest    { string id = 1; }
message MarkPaidRequest   { string id = 1; }
message ListByUserRequest {
  string user_id = 1;
  int32  limit   = 2;
  int32  offset  = 3;
}

message OrderResponse {
  string id          = 1;
  string user_id     = 2;
  string status      = 3;
  int64  total_cents = 4;
  repeated OrderItem items = 5;
  string created_at  = 6;
  string updated_at  = 7;
}

message ListOrdersResponse {
  repeated OrderResponse orders = 1;
  int32 total = 2;
}
